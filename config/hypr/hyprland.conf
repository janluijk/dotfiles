source = ~/.config/hypr/default-config.conf
# Important for nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# Autolaunch
## Caelestia shell (~/shell)
exec-once = qs

## Authentication agent
exec-once = systemctl --user start hyprpolkitagent

## Bluetooth
exec-once = blueman-applet
exec-once = hyprpaper
# exec-once = sh -c "until dbus-send --session --dest=org.freedesktop.DBus --type=method_call / org.freedesktop.DBus.ListNames >/dev/null 2>&1; do sleep 0.2; done; elephant"
#exec-once = sh -c "sleep 1 && walker --gapplication-service"


# Special workspace (scratchpad terminal)
workspace = special:terminal, on-created-empty:kitty

# Float and center windows on special workspace
windowrule = float on, match:workspace special:terminal
windowrule = size 80% 80%, match:workspace special:terminal
windowrule = center on, match:workspace special:terminal

# Terminals always use unfocused opacity
windowrule = opacity 0.8 0.8, match:class kitty

# Keybinds
bind = SUPER, T, togglespecialworkspace, terminal
bind = SUPER, return, exec, kitty
bind = SUPER, space, global, caelestia:launcher
bind = SUPER, escape, global, caelestia:session
bind = SUPER, D, global, caelestia:dashboard
bind = SUPER, A, global, caelestia:controlCenter
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen
bind = SUPER, C, togglefloating

bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, J, movefocus, u
bind = SUPER, K, movefocus, d


decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.98

    shadow {
        enabled = true
        range = 10
        render_power = 10
        color = rgba(000000cc)
        offset = 0, 0
        scale = 1.0
    }

    blur {
        enabled = true
        size = 12
        passes = 4
        special = true
        vibrancy = 0.15
    }

    dim_special = 0.4
}

# Blur for caelestia shell panels

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

input {
  sensitivity = 1.2
}

general {
    col.inactive_border = 0xbb424242
    col.active_border = 0xbb424242
    gaps_out = 8
    gaps_in = 8
}

decoration {
    inactive_opacity = 0.8
}
